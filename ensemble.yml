# Ensemble configuration: one Pi invocation per entry.
#
# Identifiers below were verified against the installed pi 0.84.4 via:
#   pi --list-models                   # catalog of provider/model pairs
#   pi auth check --provider <name>    # whether credentials are ready
#
# Auth state on this machine:
#   openai-codex    ready (OAuth, ChatGPT/Codex subscription)
#   github-copilot  ready (OAuth, Copilot subscription — provides Claude/Gemini)
#   opencode-go     ready (API key)
#   zai             ready (API key)
#
# Add, remove, or edit entries freely; no Ruby changes needed.

agents:
  # ChatGPT/Codex subscription (OAuth)
  - provider: openai-codex
    model: gpt-5.4

  # Claude via GitHub Copilot subscription (OAuth).
  # Note: Copilot only serves models available to your plan/integration;
  # a 400 "model_not_available_for_integrator" error lists what IS available.
  - provider: github-copilot
    model: claude-sonnet-5

  # OpenCode Go (OPENCODE_API_KEY)
  - provider: opencode-go
    model: kimi-k2.6

  # Z-AI (ZAI_API_KEY)
  - provider: zai
    model: glm-5.3

# Optional: when present, after all agents finish, this model consolidates
# the run's reports (attribution-preserving; see consolidate_prompt.md) and
# writes a <...>_consolidated_pi_<provider>_<model>.md report into the same
# run dir. Its failure never affects the run's exit status.
consolidator:
  provider: openai-codex
  model: gpt-5.4
