inherit_from:
  - .rubocop-shared.yml

AllCops:
  Exclude:
    - 'vendor/**/*'
    - 'tmp/**/*'
    - 'coverage/**/*'

Layout/CaseIndentation:
  Enabled: false

Layout/LineEndStringConcatenationIndentation:
  Enabled: false

# exe/pi-models defines Data members (contextWindow, maxTokens) mirroring
# pi's JSON field names; snake_case aliases are provided alongside them.
Naming/MethodName:
  Exclude:
    - exe/pi-models

Naming/MethodParameterName:
  Exclude:
    - lib/agent_council.rb

RSpec/DescribeMethod:
  Enabled: false

RSpec/IndexedLet:
  Enabled: false

RSpec/SpecFilePathFormat:
  Enabled: false

RSpec/VerifiedDoubleReference:
  Enabled: false

Style/AccessModifierDeclarations:
  Enabled: true
  EnforcedStyle: inline

Style/DoubleNegation:
  Enabled: false

Style/EmptyStringInsideInterpolation:
  Enabled: false

Style/FetchEnvVar:
  Enabled: false

Style/FormatStringToken:
  Enabled: false

Style/KeywordParametersOrder:
  Enabled: true

Style/MultilineBlockChain:
  Enabled: false

Style/ParallelAssignment:
  Enabled: false

Style/RedundantConstantBase:
  Enabled: false

Style/RedundantFormat:
  Enabled: false

Style/StderrPuts:
  Enabled: false

Style/StringConcatenation:
  Enabled: false

Style/TernaryParentheses:
  Enabled: false
