# Minimal smoke-test config: one inexpensive model, for checking that your
# setup works (auth, invocation, report writing) without a full ensemble run
# (AC_HOME is the gem or source checkout directory; see the README):
#
#   agent-council \
#     "$AC_HOME/examples/prompts/smoke-test-prompt.md" \
#     "$AC_HOME/examples/configs/single.yml"
agents:
  - provider: opencode-go # OPENCODE_API_KEY
    model: kimi-k2.7-code
